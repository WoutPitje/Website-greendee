name: Build CMS image

# The Coolify server is too small to build Strapi's admin panel (it peaks well
# over 1.5 GB and once took the whole box down). So we build here and let
# Coolify only pull the finished image.

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/website-greendee-cms

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          # The server runs x86_64; don't waste time on other architectures.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Coolify to deploy the new image
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_CMS_UUID: ${{ vars.COOLIFY_CMS_UUID }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_CMS_UUID" ]; then
            echo "Coolify secret/variables niet gezet - image is gepusht, deploy handmatig starten."
            exit 0
          fi
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_CMS_UUID&force=true"
